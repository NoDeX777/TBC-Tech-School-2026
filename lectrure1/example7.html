<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Forms</h1>
    <form>
        <label for="username">username</label>
        <input type="text" id="username" name="username"><br>
        <label for="password">password</label>
        <input type="text" id="password" name="password"><br>
        <label for="email">email</label>
        <input type="email" id="email" name="email"><br>
        <label for="gender">gender</label>
        <label>male</label><input type="radio" id="gender" name="gender">
        <label>female</label><input type="radio" id="gender" name="gender"><br>
        <label for="hobbie">hobbie:</label>
        <label>football</label><input type="checkbox" id="hobbie" name="hobbie"><br>
        <label>basketball</label><input type="checkbox">
        <label for="country">country</label>
        <select id="country" name="country">
            <option value="georgia">georgia</option>
            <option value="russia">russia</option>
            <option value="usa">usa</option>
        </select><br>
        <label for="message">message</label>
        <textarea id="message" name="message"></textarea><br>
        <input type="submit" value="submit">
    </form>
</body>

</html>
